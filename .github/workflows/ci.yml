name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # 固定版本，保证与本地 rustfmt / clippy 输出一致
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Smoke test
        run: .\target\release\memory-optimizer.exe --status

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-optimizer-windows-x64
          path: target/release/memory-optimizer.exe

  non-windows-check:
    name: Non-Windows compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Build (release)
        run: cargo build --release
